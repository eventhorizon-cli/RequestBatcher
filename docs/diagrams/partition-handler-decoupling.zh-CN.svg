<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title description">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#596773"/></marker>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#303b44;text-anchor:middle;font-size:22px}.edge{fill:none;stroke:#596773;stroke-width:2;marker-end:url(#arrow)}.control{stroke-dasharray:6 5}.heading{font-weight:600}.label{font-size:20px}</style>
</defs>
<rect width="1400" height="560" fill="#ffffff"/>
<title id="title">Partition 归属与 Handler 并发</title>
<desc id="description">同一消费组内，一个 Consumer 负责全部 P 个 Partition。一个调度循环先取得执行名额，再拉取并启动一个批次。最多 H 个 Handler 批次并发执行，每批完成后归还名额。</desc>
<!-- Contract: queue -> dispatch -> handlers is request flow; handlers -> slots -> dispatch is slot control. P and H are independent; P may equal 1. The loop reserves a slot before pulling. No per-partition Handler assignment or ordering is implied. -->
<path class="edge" d="M 340 190 H 500"/>
<path class="edge" d="M 920 190 H 1080"/>
<path class="edge control" d="M 1220 300 V 460 H 920"/>
<path class="edge control" d="M 710 410 V 300"/>
<rect x="40" y="80" width="300" height="220" fill="#fff4d6" stroke="#8a6a1d" stroke-width="2"/>
<rect x="500" y="80" width="420" height="220" fill="#edf1f5" stroke="#596773" stroke-width="2"/>
<rect x="1080" y="80" width="280" height="220" fill="#f4edfb" stroke="#75529b" stroke-width="2"/>
<rect x="500" y="410" width="420" height="100" fill="#edf1f5" stroke="#596773" stroke-width="2"/>
<text x="190" y="133" class="heading">P 个队列 Partition</text>
<text x="190" y="180" class="">P 可以为 1</text>
<text x="190" y="220" class="">存放排队请求</text>
<text x="190" y="260" class="">由一个 Consumer 负责</text>
<text x="710" y="126" class="heading">一个拉取 Consumer</text>
<text x="710" y="158" class="heading">BatchDispatchLoop</text>
<text x="710" y="200" class="">1. 等待一个执行名额</text>
<text x="710" y="238" class="">2. 从一个 Partition 拉取一批</text>
<text x="710" y="276" class="">3. 启动一个 Handler 批次</text>
<text x="1220" y="133" class="heading">Handler 批次</text>
<text x="1220" y="180" class="">H = MaxConcurrency</text>
<text x="1220" y="220" class="">最多 H 批并发执行</text>
<text x="1220" y="260" class="">每批占用一个名额</text>
<text x="710" y="449" class="heading">共享执行名额</text>
<text x="710" y="484" class="">所有 P 个 Partition 共用</text>
<text x="420" y="160" class="label">拉取一批</text>
<text x="1000" y="160" class="label">分发</text>
<text x="865" y="346" class="label">可用名额</text>
<text x="865" y="376" class="label">允许继续拉取</text>
<text x="1090" y="375" class="label">批次完成</text>
<text x="1090" y="405" class="label">归还执行名额</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="520" viewBox="0 0 1380 520" role="img" aria-labelledby="title desc">
  <title id="title">Tracing completion publication order</title>
  <desc id="desc">A direct completion ends the Execute span before publishing its Task. A wrapped completion releases its inner Task first, then follows the outer Task and ends the span.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#596773"/></marker></defs>
  <rect width="1380" height="520" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#303b44" font-size="21">
    <text x="35" y="42">Direct path: the returned Task is the registered completion Task</text>
    <text x="35" y="248">Wrapped path: the returned Task differs from the registered completion Task</text>
    <g fill="none" stroke="#596773" stroke-width="2" marker-end="url(#arrow)">
      <path d="M265 130 H305"/><path d="M535 130 H575"/>
      <path d="M265 340 H305"/><path d="M535 340 H575"/><path d="M805 340 H845"/><path d="M1075 340 H1115"/>
    </g>
    <g stroke-width="1.5">
      <rect x="35" y="82" width="230" height="96" rx="5" fill="#edf1f5" stroke="#596773"/>
      <rect x="305" y="82" width="230" height="96" rx="5" fill="#f4edfb" stroke="#75529b"/>
      <rect x="575" y="82" width="230" height="96" rx="5" fill="#e9f6f1" stroke="#2f6f5e"/>
      <rect x="35" y="292" width="230" height="96" rx="5" fill="#edf1f5" stroke="#596773"/>
      <rect x="305" y="292" width="230" height="96" rx="5" fill="#edf1f5" stroke="#596773"/>
      <rect x="575" y="292" width="230" height="96" rx="5" fill="#eaf2ff" stroke="#3567a7"/>
      <rect x="845" y="292" width="230" height="96" rx="5" fill="#f4edfb" stroke="#75529b"/>
      <rect x="1115" y="292" width="230" height="96" rx="5" fill="#e9f6f1" stroke="#2f6f5e"/>
    </g>
    <g text-anchor="middle">
      <text x="150" y="123"><tspan x="150">Outcome ready</tspan><tspan x="150" dy="28">and attached</tspan></text>
      <text x="420" y="123"><tspan x="420">End</tspan><tspan x="420" dy="28">Execute span</tspan></text>
      <text x="690" y="123"><tspan x="690">Publish</tspan><tspan x="690" dy="28">completion Task</tspan></text>
      <text x="150" y="333"><tspan x="150">Outcome ready</tspan><tspan x="150" dy="28">and attached</tspan></text>
      <text x="420" y="333"><tspan x="420">Publish</tspan><tspan x="420" dy="28">inner Task</tspan></text>
      <text x="690" y="333"><tspan x="690">Outer Task</tspan><tspan x="690" dy="28">completes</tspan></text>
      <text x="960" y="333"><tspan x="960">End</tspan><tspan x="960" dy="28">Execute span</tspan></text>
      <text x="1230" y="322" font-size="19"><tspan x="1230">Publish bridge Task</tspan><tspan x="1230" dy="25">or return completed</tspan><tspan x="1230" dy="25">Task unchanged</tspan></text>
    </g>
    <text x="35" y="435" font-size="19">Outer work can include admission waits. Explicit response calls follow the outer Task without this observer.</text>
    <text x="35" y="470" font-size="19">Tracing follows the submission delegate's Task; Execute-duration metrics may add another wrapper.</text>
  </g>
</svg>

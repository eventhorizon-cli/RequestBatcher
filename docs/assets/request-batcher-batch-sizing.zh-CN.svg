<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490">
<rect width="1080" height="490" fill="white"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle" fill="#233247">
<text x="540" y="32" font-size="20" font-weight="600" fill="#233247">同一请求量：38,400 商品请求项 / 秒（含跨调用重复） · 6 个 Pod</text>
<text x="540" y="75" font-size="19" font-weight="600" fill="#233247">原来：每批查询 20 个不同商品</text>
<rect x="28" y="92" width="226" height="104" rx="7" fill="#f2f5f9" stroke="#bccbd9"/>
<text x="141" y="118" font-size="16" font-weight="400" fill="#233247">每批请求项（去重前）</text>
<text x="141" y="157" font-size="31" font-weight="600" fill="#233247">20</text>
<text x="141" y="181" font-size="15" font-weight="400" fill="#52667c">20 个不同商品</text>
<rect x="294" y="92" width="226" height="104" rx="7" fill="#f2f5f9" stroke="#bccbd9"/>
<text x="407" y="118" font-size="16" font-weight="400" fill="#233247">下游批量 QPS</text>
<text x="407" y="157" font-size="31" font-weight="600" fill="#233247">1,920</text>
<rect x="560" y="92" width="226" height="104" rx="7" fill="#f2f5f9" stroke="#bccbd9"/>
<text x="673" y="118" font-size="16" font-weight="400" fill="#233247">下游平均 RT</text>
<text x="673" y="157" font-size="31" font-weight="600" fill="#233247">50 ms</text>
<rect x="826" y="92" width="226" height="104" rx="7" fill="#f2f5f9" stroke="#bccbd9"/>
<text x="939" y="118" font-size="16" font-weight="400" fill="#233247">每秒查询商品项数</text>
<text x="939" y="157" font-size="31" font-weight="600" fill="#233247">38,400</text>
<text x="939" y="181" font-size="15" font-weight="400" fill="#52667c">含跨调用重复</text>
<text x="540" y="243" font-size="19" font-weight="600" fill="#233247">合并示例：80 项 → 去重后 60 个商品 → 两次各 30 个</text>
<rect x="28" y="260" width="226" height="104" rx="7" fill="#edf5fb" stroke="#bccbd9"/>
<text x="141" y="286" font-size="16" font-weight="400" fill="#233247">每批请求项（去重前）</text>
<text x="141" y="325" font-size="31" font-weight="600" fill="#233247">80</text>
<text x="141" y="349" font-size="15" font-weight="400" fill="#52667c">60 个不同商品</text>
<rect x="294" y="260" width="226" height="104" rx="7" fill="#edf5fb" stroke="#bccbd9"/>
<text x="407" y="286" font-size="16" font-weight="400" fill="#233247">下游批量 QPS</text>
<text x="407" y="325" font-size="31" font-weight="600" fill="#233247">960</text>
<text x="407" y="349" font-size="15" font-weight="400" fill="#52667c">480 Handler/s × 2</text>
<rect x="560" y="260" width="226" height="104" rx="7" fill="#edf5fb" stroke="#bccbd9"/>
<text x="673" y="286" font-size="16" font-weight="400" fill="#233247">下游平均 RT</text>
<text x="673" y="325" font-size="31" font-weight="600" fill="#233247">55 ms</text>
<text x="673" y="349" font-size="15" font-weight="400" fill="#52667c">假设增长 10%</text>
<rect x="826" y="260" width="226" height="104" rx="7" fill="#edf5fb" stroke="#bccbd9"/>
<text x="939" y="286" font-size="16" font-weight="400" fill="#233247">每秒查询商品项数</text>
<text x="939" y="325" font-size="31" font-weight="600" fill="#233247">28,800</text>
<text x="939" y="349" font-size="15" font-weight="400" fill="#52667c">跨批重复仍计数</text>
<rect x="28" y="390" width="1024" height="82" rx="7" fill="#fff8e8" stroke="#bccbd9"/>
<text x="540" y="417" font-size="19" font-weight="600" fill="#233247">调用次数 −50% · 查询商品项数 −25% · 下游平均 RT +10%</text>
<text x="540" y="449" font-size="17" font-weight="400" fill="#233247">假设示例，非压测结果；端到端延迟和资源收益需要实测。</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title description">
  <title id="title">RequestBatcher 内部调度流程</title>
  <desc id="description">队列 Partition 存放待处理请求并负责排队与路由。唯一的 BatchDispatchLoop 取得一个可用的全局执行名额后拉取并启动一批 Handler 请求。任一正在执行的 Handler 批次调用完成后会归还一个名额，循环无需等待其他 Handler 批次全部完成即可拉取并启动下一批。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475467"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #303b44; }
      .node { stroke-width: 2; }
      .core { fill: #edf1f5; stroke: #596773; }
      .handler { fill: #f4edfb; stroke: #75529b; }
      .edge { fill: none; stroke: #475467; stroke-width: 2; marker-end: url(#arrow); }
      .control { stroke-dasharray: 5 5; }
      .node-text { font-size: 22px; text-anchor: middle; }
      .heading { font-weight: 600; }
      .edge-label { font-size: 19px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1500" height="540" fill="#ffffff"/>

  <path class="edge" d="M 350 170 H 565"/>
  <path class="edge" d="M 915 170 H 1150"/>
  <path class="edge control" d="M 740 370 V 247"/>
  <path class="edge control" d="M 1305 280 V 415 H 885"/>

  <g>
    <rect class="node core" x="40" y="80" width="310" height="180"/>
    <text class="node-text heading" x="195" y="126">队列 Partition</text>
    <text class="node-text" x="195" y="166">存放待处理请求</text>
    <text class="node-text" x="195" y="202">负责排队与路由</text>
  </g>

  <g>
    <rect class="node core" x="565" y="100" width="350" height="140"/>
    <text class="node-text heading" x="740" y="147">唯一的 BatchDispatchLoop</text>
    <text class="node-text" x="740" y="179">取得一个可用执行名额</text>
    <text class="node-text" x="740" y="211">再拉取一批已排队请求</text>
  </g>

  <g>
    <rect class="node handler" x="1150" y="60" width="310" height="220"/>
    <text class="node-text heading" x="1305" y="115">并行的 Handler 批次</text>
    <text class="node-text" x="1305" y="149">各批次独立执行</text>
    <text class="node-text" x="1305" y="183">每批最多 BatchSize 个</text>
    <text class="node-text" x="1305" y="217">请求</text>
  </g>

  <g>
    <rect class="node core" x="595" y="370" width="290" height="90"/>
    <text class="node-text heading" x="740" y="421">全局执行名额</text>
  </g>

  <g>
    <rect x="367" y="144" width="181" height="34" fill="#ffffff"/>
    <text class="edge-label" x="457.5" y="168">拉取下一批</text>
    <rect x="970" y="144" width="126" height="34" fill="#ffffff"/>
    <text class="edge-label" x="1033" y="168">启动批次</text>
    <rect x="782" y="269" width="240" height="58" fill="#ffffff"/>
    <text class="edge-label" x="902" y="293">释放名额后</text>
    <text class="edge-label" x="902" y="316">立即继续拉取</text>
    <rect x="900" y="388" width="375" height="54" fill="#ffffff"/>
    <text class="edge-label" x="1087.5" y="411">任一批次完成即归还名额</text>
    <text class="edge-label" x="1087.5" y="434">其他批次继续运行</text>
  </g>
</svg>

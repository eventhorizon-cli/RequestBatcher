<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="650" viewBox="0 0 1720 650" role="img" aria-labelledby="title description">
<title id="title">机会式合并的消费循环</title><desc id="description">先取得执行名额，再尝试拉取。拉到数据就分发并继续循环；所有分区都没有数据才等待通知，收到通知后重试。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#596773"/></marker>
<style>
text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#303b44; text-anchor:middle; font-size:22px; }
.node { stroke-width:2; }
.core { fill:#edf1f5; stroke:#596773; }
.handler { fill:#f4edfb; stroke:#75529b; }
.wait { fill:#eaf2ff; stroke:#3567a7; }
.client { fill:#e9f6f1; stroke:#2f6f5e; }
.edge { fill:none; stroke:#596773; stroke-width:2.5; marker-end:url(#arrow); stroke-linejoin:round; }
.control { stroke-dasharray:8 6; }
.label { font-size:22px; }
.note { font-size:21px; fill:#596773; }
</style></defs>
<rect width="1720" height="650" fill="white"/>
<path class="edge control" d="M370 355 H460"/>
<path class="edge control" d="M800 355 H860"/>
<path class="edge" d="M1060 170 V250"/>
<path class="edge" d="M1260 355 H1340"/>
<path class="edge" d="M1515 300 V115 H1210"/>
<path class="edge" d="M1060 460 V540 H630 V410"/>
<rect class="node client" x="30" y="300" width="340" height="110" rx="8"/>
<rect class="node wait" x="460" y="300" width="340" height="110" rx="8"/>
<rect class="node core" x="910" y="60" width="300" height="110" rx="8"/>
<path class="node core" d="M1060 250 L1260 355 L1060 460 L860 355 Z"/>
<rect class="node handler" x="1340" y="300" width="350" height="110" rx="8"/>

<text x="200" y="346" class=""><tspan x="200" dy="0">新请求写入队列</tspan><tspan x="200" dy="34">BufferQueue 发出通知</tspan></text>
<text x="630" y="346" class=""><tspan x="630" dy="0">等待 push 通知</tspan><tspan x="630" dy="34">没有新流量时保持等待</tspan></text>
<text x="1060" y="106" class=""><tspan x="1060" dy="0">等待并取得执行名额</tspan><tspan x="1060" dy="34">受 MaxConcurrency 限制</tspan></text>
<text x="1060" y="346" class=""><tspan x="1060" dy="0">尝试拉取下一批</tspan><tspan x="1060" dy="34">拉到数据？</tspan></text>
<text x="1515" y="346" class=""><tspan x="1515" dy="0">启动 Handler 批次</tspan><tspan x="1515" dy="34">处理完成后归还名额</tspan></text>
<text x="1450" y="55" class="label"><tspan x="1450" dy="0">继续调度</tspan><tspan x="1450" dy="30">无需等刚分发的批次完成</tspan></text>
<text x="1300" y="332" class="label"><tspan x="1300" dy="0">有数据</tspan></text>
<text x="845" y="520" class="label"><tspan x="845" dy="0">所有 Partition 均无数据</tspan></text>
<text x="830" y="332" class="label"><tspan x="830" dy="0">唤醒</tspan></text>
<text x="415" y="332" class="label"><tspan x="415" dy="0">push</tspan></text>
<text x="860" y="625" class="note"><tspan x="860" dy="0">每次最多拉取同一 Partition 中的 BatchSize 个请求；不等待凑满，也没有固定收集窗口。</tspan></text>
</svg>

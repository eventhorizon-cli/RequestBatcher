<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600"
     role="img" aria-labelledby="title description">
  <title id="title">RequestBatcher architecture</title>
  <desc id="description">
    Single requests and explicit request batches enter the coordinator, flow through the internal BufferQueue to the
    batch handler and downstream dependency, then complete the caller task with success or failure.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#596773" />
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        letter-spacing: 0;
      }
      .boundary {
        fill: #ffffff;
        stroke: #aeb8c2;
        stroke-width: 1.5;
      }
      .client {
        fill: #e9f6f1;
        stroke: #2f6f5e;
      }
      .gateway {
        fill: #eaf2ff;
        stroke: #3567a7;
      }
      .core {
        fill: #edf1f5;
        stroke: #596773;
      }
      .handler {
        fill: #f4edfb;
        stroke: #75529b;
      }
      .storage {
        fill: #fff4d6;
        stroke: #8a6a1d;
      }
      .node {
        stroke-width: 2;
        rx: 6;
      }
      .node-label {
        fill: #303b44;
        font-size: 21px;
        text-anchor: middle;
      }
      .boundary-label {
        fill: #303b44;
        font-size: 22px;
        font-weight: 600;
        text-anchor: middle;
      }
      .edge {
        fill: none;
        stroke: #596773;
        stroke-width: 2;
        marker-end: url(#arrow);
      }
      .result-edge {
        fill: none;
        stroke: #596773;
        stroke-width: 1.75;
        stroke-dasharray: 7 6;
        marker-end: url(#arrow);
      }
      .edge-label {
        fill: #303b44;
        font-size: 16px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="1800" height="600" fill="#ffffff" />
  <rect class="boundary" x="500" y="20" width="650" height="550" />
  <text class="boundary-label" x="825" y="54">RequestBatcher</text>

  <path class="edge" d="M260 185 H570" />
  <path class="edge" d="M680 230 V350" />
  <path class="edge" d="M830 425 H1250" />
  <path class="edge" d="M1470 425 H1550" />
  <path class="result-edge" d="M790 175 H880" />
  <path class="result-edge" d="M975 120 V88 H145 V120" />

  <text class="edge-label" x="415" y="138">ProcessAsync(request)</text>
  <text class="edge-label" x="415" y="162">ProcessAsync(requests)</text>
  <text class="edge-label" x="750" y="292">single / batch</text>
  <text class="edge-label" x="750" y="315">enqueue</text>
  <text class="edge-label" x="835" y="158">outcome</text>
  <text class="edge-label" x="430" y="78">complete Task</text>
  <text class="edge-label" x="1510" y="408">batch</text>

  <rect class="node client" x="30" y="120" width="230" height="110" />
  <text class="node-label" x="145" y="166">Application</text>
  <text class="node-label" x="145" y="196">caller</text>

  <rect class="node gateway" x="570" y="120" width="220" height="110" />
  <text class="node-label" x="680" y="166">RequestBatch</text>
  <text class="node-label" x="680" y="196">Coordinator</text>

  <rect class="node core" x="880" y="120" width="190" height="110" />
  <text class="node-label" x="975" y="166">Caller Task</text>
  <text class="node-label" x="975" y="196">success / error</text>

  <rect class="node core" x="570" y="350" width="260" height="150" />
  <text class="node-label" x="700" y="388">Internal BufferQueue</text>
  <text class="node-label" x="700" y="418">Memory topic</text>
  <text class="node-label" x="700" y="448">round robin /</text>
  <text class="node-label" x="700" y="478">Partition Key</text>

  <rect class="node handler" x="1250" y="360" width="220" height="130" />
  <text class="node-label" x="1360" y="404">Batch handler</text>
  <text class="node-label" x="1360" y="434">up to BatchSize</text>
  <text class="node-label" x="1360" y="464">requests</text>

  <rect class="node storage" x="1550" y="365" width="210" height="120" />
  <text class="node-label" x="1655" y="404">Database,</text>
  <text class="node-label" x="1655" y="434">cache, or</text>
  <text class="node-label" x="1655" y="464">bulk API</text>
</svg>

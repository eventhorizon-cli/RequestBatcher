<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title description">
  <title id="title">RequestBatcher architecture</title>
  <desc id="description">A caller submits a request to RequestBatchCoordinator. The coordinator enqueues work in an internal BufferQueue memory topic with partitions and routing. A batch handler sends work to a database, cache, or bulk API. Dashed arrows show the caller task completing after the handler outcome.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#475467" />
    </marker>
  </defs>

  <rect width="1800" height="600" fill="#ffffff" />

  <g fill="none" stroke="#475467" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 240 280 H 410" />
    <path d="M 720 265 H 820" />
    <path d="M 1100 260 H 1190 V 152 H 1260" />
    <path d="M 1410 225 V 355" />
  </g>

  <g fill="none" stroke="#475467" stroke-width="2.25" stroke-dasharray="9 7" marker-end="url(#arrow)">
    <path d="M 565 340 V 475 H 820" />
    <path d="M 820 505 H 140 V 340" />
  </g>

  <g stroke-width="2.25">
    <rect x="40" y="220" width="200" height="120" rx="8" fill="#e9f6f1" stroke="#2f6f5e" />
    <rect x="410" y="190" width="310" height="150" rx="8" fill="#eaf2ff" stroke="#3567a7" />
    <rect x="820" y="170" width="280" height="180" rx="8" fill="#edf1f5" stroke="#596773" />
    <rect x="1260" y="80" width="300" height="145" rx="8" fill="#f4edfb" stroke="#75529b" />
    <rect x="1260" y="355" width="300" height="135" rx="8" fill="#fff4d6" stroke="#8a6a1d" />
    <rect x="820" y="420" width="280" height="115" rx="8" fill="#edf1f5" stroke="#596773" />
  </g>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#344054" text-anchor="middle">
    <text x="335" y="245">ProcessAsync</text>
    <text x="760" y="235">enqueue</text>
    <text x="1500" y="292">batch operation</text>
    <text x="685" y="455">after handler outcome</text>
    <text x="480" y="485">complete Task</text>
  </g>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g fill="#173f35" font-size="24">
      <text x="140" y="270">Application</text>
      <text x="140" y="302">caller</text>
    </g>
    <g fill="#1d3b66" font-size="24">
      <text x="565" y="255">RequestBatchCoordinator</text>
      <text x="565" y="290">&lt;TRequest&gt;</text>
    </g>
    <g fill="#303b44" font-size="24">
      <text x="960" y="220">Internal BufferQueue</text>
      <text x="960" y="255">Memory topic</text>
      <text x="960" y="290" font-size="20">round robin /</text>
      <text x="960" y="320" font-size="20">Partition Key</text>
    </g>
    <g fill="#422d59" font-size="24">
      <text x="1410" y="130">IRequestBatchHandler</text>
      <text x="1410" y="164">&lt;TRequest&gt;</text>
      <text x="1410" y="198" font-size="22">up to BatchSize requests</text>
    </g>
    <g fill="#4d3b0e" font-size="24">
      <text x="1410" y="405">Database, cache,</text>
      <text x="1410" y="440">or bulk API</text>
    </g>
    <g fill="#303b44" font-size="24">
      <text x="960" y="462">Caller Task</text>
      <text x="960" y="497">success or error</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="650" viewBox="0 0 1720 650" role="img" aria-labelledby="title description">
<title id="title">Opportunistic merging consumer loop</title><desc id="description">Acquire a slot, try pulling, dispatch a batch, then repeat. Wait for notifications only when all assigned partitions have no data.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#596773"/></marker>
<style>
text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#303b44; text-anchor:middle; font-size:22px; }
.node { stroke-width:2; }
.core { fill:#edf1f5; stroke:#596773; }
.handler { fill:#f4edfb; stroke:#75529b; }
.wait { fill:#eaf2ff; stroke:#3567a7; }
.client { fill:#e9f6f1; stroke:#2f6f5e; }
.edge { fill:none; stroke:#596773; stroke-width:2.5; marker-end:url(#arrow); stroke-linejoin:round; }
.control { stroke-dasharray:8 6; }
.label { font-size:22px; }
.note { font-size:21px; fill:#596773; }
</style></defs>
<rect width="1720" height="650" fill="white"/>
<path class="edge control" d="M370 355 H460"/>
<path class="edge control" d="M800 355 H860"/>
<path class="edge" d="M1060 170 V250"/>
<path class="edge" d="M1260 355 H1340"/>
<path class="edge" d="M1515 300 V115 H1210"/>
<path class="edge" d="M1060 460 V540 H630 V410"/>
<rect class="node client" x="30" y="300" width="340" height="110" rx="8"/>
<rect class="node wait" x="460" y="300" width="340" height="110" rx="8"/>
<rect class="node core" x="910" y="60" width="300" height="110" rx="8"/>
<path class="node core" d="M1060 250 L1260 355 L1060 460 L860 355 Z"/>
<rect class="node handler" x="1340" y="300" width="350" height="110" rx="8"/>

<text x="200" y="346" class=""><tspan x="200" dy="0">Requests enter the queue</tspan><tspan x="200" dy="34">BufferQueue signals new data</tspan></text>
<text x="630" y="346" class=""><tspan x="630" dy="0">Wait for a push notification</tspan><tspan x="630" dy="34">idle while there is no traffic</tspan></text>
<text x="1060" y="106" class=""><tspan x="1060" dy="0">Acquire an execution slot</tspan><tspan x="1060" dy="34">wait if all slots are in use</tspan></text>
<text x="1060" y="346" class=""><tspan x="1060" dy="0">Try pulling the next batch</tspan><tspan x="1060" dy="34">Data available?</tspan></text>
<text x="1515" y="346" class=""><tspan x="1515" dy="0">Start the handler batch</tspan><tspan x="1515" dy="34">release its slot when finished</tspan></text>
<text x="1450" y="55" class="label"><tspan x="1450" dy="0">Continue dispatching</tspan><tspan x="1450" dy="30">without awaiting the last batch</tspan></text>
<text x="1300" y="332" class="label"><tspan x="1300" dy="0">Yes</tspan></text>
<text x="845" y="520" class="label"><tspan x="845" dy="0">No data in any assigned partition</tspan></text>
<text x="830" y="332" class="label"><tspan x="830" dy="0">wake</tspan></text>
<text x="415" y="332" class="label"><tspan x="415" dy="0">push</tspan></text>
<text x="860" y="625" class="note"><tspan x="860" dy="0">Pull up to BatchSize queued requests from one partition; no wait to fill a batch and no collection window.</tspan></text>
</svg>

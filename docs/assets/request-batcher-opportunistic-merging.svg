<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title description">
<title id="title">Opportunistic merging consumer loop</title><desc id="description">Acquire a slot, try pulling, dispatch a batch, then repeat. Wait for notifications only when all assigned partitions have no data.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#596773"/></marker>
<style>
text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill:#303b44; text-anchor:middle; font-size:24px; }
.node { stroke-width:2; }
.core { fill:#edf1f5; stroke:#596773; }
.handler { fill:#f4edfb; stroke:#75529b; }
.wait { fill:#eaf2ff; stroke:#3567a7; }
.client { fill:#e9f6f1; stroke:#2f6f5e; }
.edge { fill:none; stroke:#596773; stroke-width:2.5; marker-end:url(#arrow); stroke-linejoin:round; }
.control { stroke-dasharray:8 6; }
.label { font-size:22px; }
.note { font-size:21px; fill:#596773; }
</style></defs>
<rect width="1500" height="720" fill="white"/>
<path class="edge" d="M350 275 H470"/>
<path class="edge" d="M870 275 H1040"/>
<path class="edge" d="M1220 220 V90 H200 V220"/>
<path class="edge" d="M670 380 V520"/>
<path class="edge control" d="M500 575 H410 V275 H470"/>
<path class="edge control" d="M1040 575 H840"/>
<rect class="node core" x="50" y="220" width="300" height="110" rx="8"/>
<path class="node core" d="M670 170 L870 275 L670 380 L470 275 Z"/>
<rect class="node handler" x="1040" y="220" width="360" height="110" rx="8"/>
<rect class="node wait" x="500" y="520" width="340" height="110" rx="8"/>
<rect class="node client" x="1040" y="520" width="360" height="110" rx="8"/>

<text x="200" y="266" class=""><tspan x="200" dy="0">Acquire an execution slot</tspan><tspan x="200" dy="34">wait if all slots are in use</tspan></text>
<text x="670" y="266" class=""><tspan x="670" dy="0">Try pulling the next batch</tspan><tspan x="670" dy="34">Data available?</tspan></text>
<text x="1220" y="266" class=""><tspan x="1220" dy="0">Start the handler batch</tspan><tspan x="1220" dy="34">release its slot when finished</tspan></text>
<text x="670" y="566" class=""><tspan x="670" dy="0">Wait for a push notification</tspan><tspan x="670" dy="34">idle while there is no traffic</tspan></text>
<text x="1220" y="566" class=""><tspan x="1220" dy="0">Requests enter the queue</tspan><tspan x="1220" dy="34">BufferQueue signals new data</tspan></text>
<text x="710" y="65" class="label"><tspan x="710" dy="0">Continue dispatching without waiting for the previous batch to finish</tspan></text>
<text x="955" y="253" class="label"><tspan x="955" dy="0">Yes</tspan></text>
<text x="770" y="434" class="label"><tspan x="770" dy="0">No data in any</tspan><tspan x="770" dy="30">assigned partition</tspan></text>
<text x="310" y="430" class="label"><tspan x="310" dy="0">On notification,</tspan><tspan x="310" dy="30">try pulling again</tspan></text>
<text x="940" y="550" class="label"><tspan x="940" dy="0">push notification</tspan></text>
<text x="750" y="690" class="note"><tspan x="750" dy="0">Pull up to BatchSize queued requests from one partition; no wait to fill a batch and no collection window.</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title description">
  <title id="title">RequestBatcher dispatch scheduling</title>
  <desc id="description">Queue partitions feed one BatchDispatchLoop. It waits for a free execution slot before pulling and starting another handler batch. Any one completed batch releases a slot, allowing the next pull while other batches continue running.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475467"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #303b44; }
      .node { stroke-width: 2; }
      .core { fill: #edf1f5; stroke: #596773; }
      .handler { fill: #f4edfb; stroke: #75529b; }
      .edge { fill: none; stroke: #475467; stroke-width: 2; marker-end: url(#arrow); }
      .control { stroke-dasharray: 5 5; }
      .label { font-size: 20px; }
      .node-text { font-size: 22px; text-anchor: middle; }
      .heading { font-weight: 600; }
      .edge-label { font-size: 19px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1500" height="540" fill="#ffffff"/>

  <path class="edge" d="M 350 170 H 565"/>
  <path class="edge" d="M 915 170 H 1150"/>
  <path class="edge control" d="M 740 360 V 265"/>
  <path class="edge control" d="M 1305 280 V 415 H 885"/>

  <g>
    <rect class="node core" x="40" y="60" width="310" height="220"/>
    <text class="node-text heading" x="195" y="125">Queue partitions</text>
    <text class="node-text" x="195" y="165">queued requests wait</text>
    <text class="node-text" x="195" y="197">for a free slot</text>
  </g>

  <g>
    <rect class="node core" x="565" y="75" width="350" height="190"/>
    <text class="node-text heading" x="740" y="128">One BatchDispatchLoop</text>
    <text class="node-text" x="740" y="160">wait for one free slot</text>
    <text class="node-text" x="740" y="192">pull the next batch</text>
    <text class="node-text" x="740" y="224">start its handler</text>
  </g>

  <g>
    <rect class="node handler" x="1150" y="60" width="310" height="220"/>
    <text class="node-text heading" x="1305" y="115">Handler batches</text>
    <text class="node-text" x="1305" y="149">run independently</text>
    <text class="node-text" x="1305" y="183">other batches keep running</text>
    <text class="node-text" x="1305" y="217">when one completes</text>
  </g>

  <g>
    <rect class="node core" x="595" y="360" width="290" height="110"/>
    <text class="node-text heading" x="740" y="406">Shared execution slots</text>
    <text class="node-text" x="740" y="438">one per running batch</text>
  </g>

  <g>
    <rect x="358" y="144" width="201" height="34" fill="#ffffff"/>
    <text class="edge-label" x="458.5" y="168">next queued batch</text>
    <rect x="950" y="144" width="166" height="34" fill="#ffffff"/>
    <text class="edge-label" x="1033" y="168">start handler batch</text>
    <rect x="782" y="280" width="265" height="54" fill="#ffffff"/>
    <text class="edge-label" x="914.5" y="304">one free slot permits</text>
    <text class="edge-label" x="914.5" y="327">the next pull</text>
    <rect x="933" y="388" width="318" height="54" fill="#ffffff"/>
    <text class="edge-label" x="1092" y="411">any one batch completes</text>
    <text class="edge-label" x="1092" y="434">and releases one slot</text>
  </g>
</svg>

name: .NET Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dotnet-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  validate:
    name: Format, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RequestBatcher.slnx

      - name: Verify formatting
        run: dotnet format RequestBatcher.slnx --no-restore --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build RequestBatcher.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/RequestBatcher.Tests/RequestBatcher.Tests.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Pack
        run: >-
          dotnet pack src/RequestBatcher/RequestBatcher.csproj
          --configuration Release
          --no-build
          --no-restore

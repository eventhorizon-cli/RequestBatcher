name: NuGet Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  publish:
    name: Build and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          package_version="${RELEASE_TAG#v}"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use the form v1.2.3 or v1.2.3-preview.1."
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Validate draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
              if [[ "$is_draft" == "true" ]]; then
                exit 0
              fi

              echo "GitHub Release $RELEASE_TAG must be a draft before package publishing starts."
              exit 1
            fi

            sleep 5
          done

          echo "A draft GitHub Release for $RELEASE_TAG was not found."
          exit 1

      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RequestBatcher.slnx

      - name: Verify formatting
        run: dotnet format RequestBatcher.slnx --no-restore --verify-no-changes --verbosity diagnostic

      - name: Build
        run: >-
          dotnet build RequestBatcher.slnx
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test tests/RequestBatcher.Tests/RequestBatcher.Tests.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Pack
        run: >-
          dotnet pack src/RequestBatcher/RequestBatcher.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts
          -p:PackageVersion=${PACKAGE_VERSION}
          -p:ContinuousIntegrationBuild=true

      - name: Publish package to NuGet
        run: >-
          dotnet nuget push "artifacts/RequestBatcher.${PACKAGE_VERSION}.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          artifacts/*.nupkg artifacts/*.snupkg
          --clobber

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

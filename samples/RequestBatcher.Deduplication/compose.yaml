services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: requestbatcher_sample
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d requestbatcher_sample"]
      interval: 2s
      timeout: 3s
      retries: 15

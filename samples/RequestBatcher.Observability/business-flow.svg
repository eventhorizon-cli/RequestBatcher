<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="500" viewBox="0 0 1480 500" role="img" aria-labelledby="title desc">
  <title id="title">Cart and pricing business flow</title>
  <desc id="desc">An external traffic generator calls Cart, Cart calls Pricing, Pricing submits to RequestBatcher, and the batch handler reads PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536574"/>
    </marker>
  </defs>
  <rect width="1480" height="500" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#173042">
    <rect x="35" y="145" width="230" height="150" rx="8" fill="#e8f3ea" stroke="#2f7d4a" stroke-width="2"/>
    <text x="55" y="180" font-size="21" font-weight="700">External client</text>
    <text x="55" y="215" font-size="16">traffic-generator</text>
    <text x="55" y="246" font-size="15" fill="#536574">8 workers</text>
    <text x="55" y="271" font-size="15" fill="#536574">1 / 32 item quotes</text>

    <rect x="320" y="145" width="230" height="150" rx="8" fill="#e8f0fb" stroke="#2f68b2" stroke-width="2"/>
    <text x="340" y="180" font-size="21" font-weight="700">Cart API</text>
    <text x="340" y="215" font-size="16">POST /cart/quote</text>
    <text x="340" y="246" font-size="15" fill="#536574">caller trace root</text>
    <text x="340" y="271" font-size="15" fill="#536574">request validation</text>

    <rect x="605" y="145" width="230" height="150" rx="8" fill="#e8f0fb" stroke="#2f68b2" stroke-width="2"/>
    <text x="625" y="180" font-size="21" font-weight="700">Pricing API</text>
    <text x="625" y="215" font-size="16">GET /prices?ids=...</text>
    <text x="625" y="246" font-size="15" fill="#536574">HTTP child span</text>
    <text x="625" y="271" font-size="15" fill="#536574">named product-reads</text>

    <rect x="890" y="115" width="285" height="210" rx="8" fill="#eef1f3" stroke="#536574" stroke-width="2"/>
    <text x="915" y="153" font-size="21" font-weight="700">RequestBatcher</text>
    <text x="915" y="188" font-size="16">Execute span</text>
    <text x="915" y="216" font-size="16">ProcessBatch span</text>
    <text x="915" y="254" font-size="15" fill="#536574">batch size 16</text>
    <text x="915" y="280" font-size="15" fill="#536574">ActivityLinks to Execute</text>
    <text x="915" y="306" font-size="15" fill="#536574">requestbatcher.name</text>

    <rect x="1230" y="145" width="215" height="150" rx="8" fill="#fff4d8" stroke="#a37a13" stroke-width="2"/>
    <text x="1250" y="180" font-size="21" font-weight="700">PostgreSQL</text>
    <text x="1250" y="215" font-size="16">products 1..100</text>
    <text x="1250" y="246" font-size="15" fill="#536574">parameterized SELECT</text>
    <text x="1250" y="271" font-size="15" fill="#536574">Npgsql child span</text>

    <line x1="265" y1="220" x2="320" y2="220" stroke="#536574" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="270" y="205" font-size="14" fill="#536574">HTTP</text>
    <line x1="550" y1="220" x2="605" y2="220" stroke="#536574" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="555" y="205" font-size="14" fill="#536574">HTTP</text>
    <line x1="835" y1="220" x2="890" y2="220" stroke="#536574" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="838" y="205" font-size="14" fill="#536574">submit</text>
    <line x1="1175" y1="220" x2="1230" y2="220" stroke="#536574" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="1183" y="205" font-size="14" fill="#536574">SQL</text>

    <rect x="320" y="380" width="855" height="52" rx="6" fill="#f5f7f8" stroke="#b8c2c9"/>
    <text x="747" y="412" text-anchor="middle" font-size="16" fill="#536574">Cart root -&gt; Pricing HTTP child -&gt; Execute caller span -&gt; linked ProcessBatch root -&gt; Npgsql child</text>
  </g>
</svg>

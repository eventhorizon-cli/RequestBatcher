<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="500" viewBox="0 0 1320 500" role="img" aria-labelledby="title desc">
  <title id="title">Cart and pricing business flow</title>
  <desc id="desc">Concurrent external callers send 2 to 10 item carts to Cart. Each Cart request creates one Execute span; Cart combines up to 20 product requests into HandleBatch operations before calling Pricing, which reads PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536574"/>
    </marker>
  </defs>
  <rect width="1320" height="500" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#173042">
    <rect x="35" y="145" width="230" height="150" rx="8" fill="#e8f3ea" stroke="#2f7d4a" stroke-width="2"/>
    <text x="55" y="180" font-size="21" font-weight="700">External client</text>
    <text x="55" y="215" font-size="16">traffic-generator</text>
    <text x="55" y="246" font-size="15" fill="#536574">32 concurrent workers</text>
    <text x="55" y="271" font-size="15" fill="#536574">2–10 item carts</text>

    <rect x="345" y="115" width="265" height="210" rx="8" fill="#e8f0fb" stroke="#2f68b2" stroke-width="2"/>
    <text x="370" y="153" font-size="21" font-weight="700">Cart API</text>
    <text x="370" y="188" font-size="16">POST /cart/quote</text>
    <text x="370" y="224" font-size="16">RequestBatcher</text>
    <text x="370" y="252" font-size="15" fill="#536574">one Execute for 2–10 IDs</text>
    <text x="370" y="280" font-size="15" fill="#536574">BatchSize 20 product requests</text>
    <text x="370" y="306" font-size="15" fill="#536574">dedupe IDs + one Pricing call</text>

    <rect x="690" y="115" width="265" height="210" rx="8" fill="#e8f0fb" stroke="#2f68b2" stroke-width="2"/>
    <text x="715" y="153" font-size="21" font-weight="700">Pricing API</text>
    <text x="715" y="188" font-size="16">GET /prices?ids=...</text>
    <text x="715" y="224" font-size="16">direct PostgreSQL query</text>
    <text x="715" y="252" font-size="15" fill="#536574">ASP.NET Core HTTP span</text>
    <text x="715" y="280" font-size="15" fill="#536574">Npgsql database span</text>
    <text x="715" y="306" font-size="15" fill="#536574">Npgsql metrics</text>

    <rect x="1035" y="145" width="215" height="150" rx="8" fill="#fff4d8" stroke="#a37a13" stroke-width="2"/>
    <text x="1055" y="180" font-size="21" font-weight="700">PostgreSQL</text>
    <text x="1055" y="215" font-size="16">products 1..100</text>
    <text x="1055" y="246" font-size="15" fill="#536574">parameterized SELECT</text>
    <text x="1055" y="271" font-size="15" fill="#536574">database telemetry</text>

    <line x1="265" y1="220" x2="345" y2="220" stroke="#536574" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="278" y="205" font-size="14" fill="#536574">HTTP</text>
    <line x1="610" y1="220" x2="690" y2="220" stroke="#536574" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="650" y="205" text-anchor="middle" font-size="13" fill="#536574">batch HTTP</text>
    <line x1="955" y1="220" x2="1035" y2="220" stroke="#536574" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="981" y="205" font-size="14" fill="#536574">SQL</text>

    <rect x="240" y="380" width="840" height="52" rx="6" fill="#f5f7f8" stroke="#b8c2c9"/>
    <text x="660" y="412" text-anchor="middle" font-size="16" fill="#536574">N caller traces → HandleBatch links → Pricing HTTP span → Npgsql database span</text>
  </g>
</svg>

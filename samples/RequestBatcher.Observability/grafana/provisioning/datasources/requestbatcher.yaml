apiVersion: 1

datasources:
  - name: RequestBatcher Prometheus
    uid: requestbatcher-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST

  - name: RequestBatcher Tempo
    uid: requestbatcher-tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    isDefault: false
    editable: false

  - name: RequestBatcher Loki
    uid: requestbatcher-loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    isDefault: false
    editable: false
